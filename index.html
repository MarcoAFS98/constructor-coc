<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#12161f">
  <title>Construtor CoC</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <style>
    :root {
      --bg-dark: #12161f;
      --card-bg: #1c2331;
      --accent-gold: #ffb703;
      --accent-green: #52b788;
      --accent-green-bright: #74c69d;
      --text-main: #f8f9fa;
      --text-sub: #a0aec0;
      --border-color: #2a3447;
      --input-bg: #151a24;
      --danger-color: #e63946;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, #d4a373, #ffb703);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .header-titles h1 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .header-titles p {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .btn-json {
      background: var(--input-bg);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Estilos da Lista de Construtores */
    .builder-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .builder-card {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .builder-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .builder-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .builder-meta {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .builder-time-group {
      text-align: right;
    }

    .builder-end-time {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .builder-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .badge-night { background: rgba(230, 57, 70, 0.2); color: #e63946; }
    .badge-ideal { background: rgba(82, 183, 136, 0.2); color: #74c69d; }
    .badge-day { background: rgba(255, 183, 3, 0.2); color: #ffb703; }

    /* Modal JSON */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-content textarea {
      width: 100%;
      height: 140px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 10px;
      padding: 10px;
      font-size: 0.8rem;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .modal-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-btn-confirm { background: var(--accent-gold); color: #000; }
    .modal-btn-cancel { background: var(--input-bg); color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-info">
        <div class="logo">🔨</div>
        <div class="header-titles">
          <h1>Construtor CoC</h1>
          <p>Gestor de Obras & Timers JSON</p>
        </div>
      </div>
      <button class="btn-json" onclick="openJsonModal()">📥 Ler JSON</button>
    </header>

    <div class="card">
      <div class="section-title">
        <span>🔨 Construtores & Pesquisas Ativas</span>
        <span id="active-count" style="font-size:0.75rem; color:var(--text-sub);">(0 encontradas)</span>
      </div>
      
      <div id="builder-list-container" class="builder-list">
        <div style="text-align: center; color: var(--text-sub); padding: 20px 0; font-size: 0.85rem;">
          Nenhuma obra importada.<br>Clique em <b>📥 Ler JSON</b> para colar os dados do jogo!
        </div>
      </div>
    </div>
  </div>

  <!-- Modal JSON -->
  <div class="modal" id="json-modal">
    <div class="modal-content">
      <span class="section-title">Importar Dados da Vila</span>
      <p style="font-size:0.8rem; color:var(--text-sub);">Cole o código JSON exportado do jogo para ler todas as obras:</p>
      <textarea id="json-input" placeholder='{"buildings": [...], "units": [...]}'></textarea>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-cancel" onclick="closeJsonModal()">Cancelar</button>
        <button class="modal-btn modal-btn-confirm" onclick="importJSON()">Ler Obras</button>
      </div>
    </div>
  </div>

  <script>
    // Dicionário de mapeamento dos IDs principais
    const BUILDING_NAMES = {
      1000007: "Estrutura Especial",
      1000071: "Acampamento / Edifício Sombrio",
      1000003: "Quartel Sombrio",
      1000005: "Quartel Sombrio",
      1000059: "Fábrica de Feitiços Sombrios",
      1000034: "Torre de Arqueria (Base)",
      1000036: "Canhão Duplo (Base)",
      1000042: "Posto da Guarda (Base)",
      4000005: "Laboratório: Mago",
      4000034: "Laboratório Base: Servo",
      28000006: "Evolução: Grande Guardião"
    };

    function openJsonModal() { document.getElementById('json-modal').style.display = 'flex'; }
    function closeJsonModal() { document.getElementById('json-modal').style.display = 'none'; }

    function importJSON() {
      try {
        const raw = document.getElementById('json-input').value;
        const data = JSON.parse(raw);
        const activeItems = [];

        // 1. Varrer Edifícios (Vila Principal & Base do Construtor)
        const allBuildings = [...(data.buildings || []), ...(data.buildings2 || [])];
        allBuildings.forEach(b => {
          if (b.timer && b.timer > 0) {
            const name = BUILDING_NAMES[b.data] || `Edifício (${b.data})`;
            activeItems.push({ name, timer: b.timer });
          }
        });

        // 2. Varrer Laboratório (Tropas)
        const allUnits = [...(data.units || []), ...(data.units2 || [])];
        allUnits.forEach(u => {
          if (u.timer && u.timer > 0) {
            const name = BUILDING_NAMES[u.data] || `Laboratório (ID ${u.data})`;
            activeItems.push({ name, timer: u.timer });
          }
        });

        // 3. Varrer Heróis
        const allHeroes = [...(data.heroes || []), ...(data.heroes2 || [])];
        allHeroes.forEach(h => {
          if (h.timer && h.timer > 0) {
            const name = BUILDING_NAMES[h.data] || `Evolução Herói (ID ${h.data})`;
            activeItems.push({ name, timer: h.timer });
          }
        });

        renderBuilderList(activeItems);
        closeJsonModal();
      } catch (e) {
        alert('Código JSON inválido ou mal formatado!');
      }
    }

    function renderBuilderList(items) {
      const container = document.getElementById('builder-list-container');
      const countLabel = document.getElementById('active-count');

      if (items.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 20px 0;">Nenhuma obra ativa encontrada no JSON.</div>`;
        countLabel.innerText = "(0 encontradas)";
        return;
      }

      // Ordenar do timer mais curto para o mais longo
      items.sort((a, b) => a.timer - b.timer);
      countLabel.innerText = `(${items.length} ativas)`;

      const now = Date.now();
      let html = '';

      items.forEach(item => {
        const endTime = new Date(now + item.timer * 1000);
        const timeStr = endTime.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        const dateStr = endTime.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });

        const h = Math.floor(item.timer / 3600);
        const m = Math.floor((item.timer % 3600) / 60);
        let durationText = `${h}h ${m}m restantes`;
        if (h >= 24) {
          const d = Math.floor(h / 24);
          const remH = h % 24;
          durationText = `${d}d ${remH}h restantes`;
        }

        const endHour = endTime.getHours();
        let badgeHtml = '';
        if (endHour >= 23 || endHour < 7) {
          badgeHtml = `<span class="builder-badge badge-night">⚠️ Madrugada (${timeStr})</span>`;
        } else if ((endHour >= 7 && endHour <= 9) || (endHour >= 18 && endHour <= 22)) {
          badgeHtml = `<span class="builder-badge badge-ideal">💡 Horário Ideal (${timeStr})</span>`;
        } else {
          badgeHtml = `<span class="builder-badge badge-day">ℹ️ Término às ${timeStr}</span>`;
        }

        html += `
          <div class="builder-card">
            <div class="builder-info">
              <span class="builder-title">${item.name}</span>
              <span class="builder-meta">${durationText} • ${dateStr}</span>
            </div>
            <div class="builder-time-group">
              <div class="builder-end-time">${timeStr}</div>
              ${badgeHtml}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW err:', err));
      });
    }
  </script>
</body>
</html>
